
apiVersion: apps/v1
kind: Deployment

metadata:
  name: learnora-deployment
  namespace: learnora

spec:
  replicas: 2

  selector:
    matchLabels:
      app: learnora

  template:
    metadata:
      labels:
        app: learnora

    spec:
      containers:
        - name: learnora
          image: soumyadeep7872/autodeploy-web:dc1d4b3dc131
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
